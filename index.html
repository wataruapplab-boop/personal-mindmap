
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マインドマップ</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; font-family: sans-serif; color: #202124;
  background: #f5f6f8;
}
header {
  position: sticky; top: 0; z-index: 5;
  background: white; padding: 12px 16px;
  border-bottom: 1px solid #ddd;
}
h1 { font-size: 19px; margin: 0 0 10px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 7px; }
button {
  border: 1px solid #ccc; border-radius: 8px;
  background: white; padding: 9px 12px;
  font-size: 14px; cursor: pointer;
}
#status { font-size: 12px; color: #666; margin-top: 8px; }
#workspace {
  overflow: auto; height: calc(100dvh - 116px);
  padding: 20px;
}
#tree {
  display: flex; align-items: center;
  min-width: max-content; min-height: 65vh;
  padding: 12px;
}
.branch {
  display: flex; flex-direction: column;
  justify-content: center; padding: 8px 0 8px 30px;
}
.branch:empty { display: none; }
.item { display: flex; align-items: center; position: relative; }
.item:before {
  content: ""; position: absolute; left: -30px;
  width: 30px; border-top: 1px solid #b6bdc8;
}
.branch > .item:before { display: none; }
.node {
  min-width: 110px; max-width: 250px;
  padding: 11px 14px; margin: 8px 0;
  border: 1px solid #c4cbd6; border-radius: 10px;
  background: white; overflow-wrap: anywhere;
  cursor: grab; user-select: none;
  -webkit-user-select: none; touch-action: none;
}
.node:focus-visible { outline: 2px solid #3867d6; }
.node.selected {
  border: 2px solid #3867d6;
  padding: 10px 13px; background: #edf2ff;
}
.root-node { background: #e5edff; font-weight: 600; }
.node.dragging { opacity: .4; }
.node.drop-target { outline: 3px solid #35a568; }
.children {
  display: flex; align-items: stretch; position: relative;
}
.children:before {
  content: ""; position: absolute; left: 0;
  top: 0; bottom: 0; border-left: 1px solid #b6bdc8;
}
.hint { color: #666; font-size: 13px; line-height: 1.6; }
@media(max-width:600px) {
  #workspace { padding: 10px; }
  .node { max-width: 200px; min-width: 100px; }
  .branch { padding-left: 24px; }
  .item:before { left: -24px; width: 24px; }
}
</style>
</head>
<body>
<header>
  <h1>マインドマップ</h1>
  <div class="toolbar">
    <button id="addSibling">＋ 同階層</button>
    <button id="addChild">＋ 子階層</button>
    <button id="editNode">編集</button>
    <button id="deleteNode">削除</button>
    <button id="resetMap">初期化</button>
  </div>
  <div id="status">準備中</div>
</header>
<main id="workspace">
  <p class="hint">
    ノードを選択して操作。Enter：同階層、Tab：子階層、
    Shift＋Tab：階層を上げる。ノードをドラッグして別のノードに重ねると、
    その子階層に移動します。
  </p>
  <div id="tree"></div>
</main>
<script>
(() => {
  const KEY = "personal-mindmap-prototype-v1";
  let nextId = 1;
  let selectedId = 1;
  let drag = null;
  let suppressClick = false;

  const makeNode = (text, children = []) =>
    ({ id: nextId++, text, children });

  function defaultMap() {
    return makeNode("マインドマップの中心テーマ", [
      makeNode("アイデア 1"),
      makeNode("アイデア 2")
    ]);
  }

  function loadMap() {
    try {
      const saved = localStorage.getItem(KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (data && Number.isFinite(data.id) &&
            typeof data.text === "string" &&
            Array.isArray(data.children)) return data;
      }
    } catch (e) {}
    return defaultMap();
  }

  let root = loadMap();

  function findNode(id, node = root, parent = null) {
    if (node.id === id) return { node, parent };
    for (const child of node.children) {
      const found = findNode(id, child, node);
      if (found) return found;
    }
    return null;
  }

  function setNextId(node) {
    nextId = Math.max(nextId, node.id + 1);
    node.children.forEach(setNextId);
  }
  setNextId(root);

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(root));
      document.getElementById("status").textContent =
        "ブラウザに保存済み（Drive未接続）";
    } catch (e) {
      document.getElementById("status").textContent =
        "保存失敗：ブラウザの保存設定を確認してください";
    }
  }

  function focusSelected() {
    const el = document.querySelector(
      '.node[data-id="' + selectedId + '"]'
    );
    if (el) el.focus({ preventScroll: true });
  }

  function render(restoreFocus = false) {
    const tree = document.getElementById("tree");
    const fragment = document.createDocumentFragment();

    function makeBranch(node, isRoot = false) {
      const branch = document.createElement("div");
      branch.className = "branch";

      const item = document.createElement("div");
      item.className = "item";

      const card = document.createElement("div");
      card.className = "node";
      if (node.id === selectedId) card.classList.add("selected");
      if (isRoot) card.classList.add("root-node");

      card.textContent = node.text;
      card.tabIndex = 0;
      card.draggable = false;
      card.dataset.id = String(node.id);
      card.setAttribute("role", "button");

      card.addEventListener("click", () => {
        if (suppressClick) {
          suppressClick = false;
          return;
        }
        selectedId = node.id;
        document.querySelectorAll(".node").forEach(el => {
          el.classList.toggle(
            "selected", Number(el.dataset.id) === selectedId
          );
        });
        card.focus({ preventScroll: true });
        document.getElementById("status").textContent =
          "選択中：" + node.text;
      });

      card.addEventListener("dblclick", event => {
        event.preventDefault();
        selectedId = node.id;
        editSelected();
      });

      card.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          event.stopPropagation();
          selectedId = node.id;
          addNode(node.id === root.id ? "child" : "sibling");
        } else if (event.key === "Tab") {
          event.preventDefault();
          event.stopPropagation();
          selectedId = node.id;
          addNode(event.shiftKey ? "outdent" : "child");
        }
      });

      card.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        drag = {
          id: node.id,
          startX: event.clientX,
          startY: event.clientY,
          active: false,
          targetId: null,
          pointerId: event.pointerId
        };
      });

      item.appendChild(card);
      branch.appendChild(item);

      if (node.children.length) {
        const children = document.createElement("div");
        children.className = "children";
        node.children.forEach(child =>
          children.appendChild(makeBranch(child))
        );
        branch.appendChild(children);
      }
      return branch;
    }

    fragment.appendChild(makeBranch(root, true));
    tree.replaceChildren(fragment);
    if (restoreFocus) focusSelected();
  }

  function addNode(kind) {
    const found = findNode(selectedId);
    if (!found) return;

    let parent;
    if (kind === "child" || (kind === "sibling" && !found.parent)) {
      parent = found.node;
    } else if (kind === "outdent") {
      if (!found.parent || found.node.id === root.id) return;
      const grand = findNode(found.parent.id);
      if (!grand || !grand.parent) return;
      parent = grand.parent;
    } else {
      parent = found.parent;
    }

    if (!parent) return;
    const newNode = makeNode("新しいアイデア");
    parent.children.push(newNode);
    selectedId = newNode.id;
    save();
    render(true);
    editSelected();
  }

  function editSelected() {
    const found = findNode(selectedId);
    if (!found) return;

    const value = prompt("ノードの文字を入力してください", found.node.text);
    if (value !== null && value.trim()) {
      found.node.text = value.trim();
      save();
      render(true);
    } else {
      focusSelected();
    }
  }

  function deleteSelected() {
    const found = findNode(selectedId);
    if (!found || !found.parent) {
      alert("中心テーマは削除できません。");
      return;
    }
    if (!confirm("このノードと、その子ノードを削除しますか？")) return;

    found.parent.children =
      found.parent.children.filter(n => n.id !== selectedId);
    selectedId = found.parent.id;
    save();
    render(true);
  }

  function contains(node, id) {
    return node.id === id ||
      node.children.some(child => contains(child, id));
  }

  function moveNode(fromId, toId) {
    if (fromId === root.id || fromId === toId) return;
    const from = findNode(fromId);
    const to = findNode(toId);
    if (!from || !from.parent || !to) return;

    if (contains(from.node, toId)) {
      document.getElementById("status").textContent =
        "自分自身や子ノードの中には移動できません";
      return;
    }

    from.parent.children =
      from.parent.children.filter(n => n.id !== fromId);
    to.node.children.push(from.node);
    selectedId = fromId;
    save();
    render(true);
  }

  document.addEventListener("pointermove", event => {
    if (!drag || event.pointerId !== drag.pointerId) return;

    const distance = Math.hypot(
      event.clientX - drag.startX,
      event.clientY - drag.startY
    );
    if (distance > 7) drag.active = true;
    if (!drag.active) return;

    const source = document.querySelector(
      '.node[data-id="' + drag.id + '"]'
    );
    if (source) source.classList.add("dragging");

    document.querySelectorAll(".node").forEach(el =>
      el.classList.remove("drop-target")
    );

    const under = document.elementFromPoint(
      event.clientX, event.clientY
    );
    const target = under && under.closest(".node");
    if (target && Number(target.dataset.id) !== drag.id) {
      target.classList.add("drop-target");
      drag.targetId = Number(target.dataset.id);
    } else {
      drag.targetId = null;
    }
  });

  document.addEventListener("pointerup", event => {
    if (!drag || event.pointerId !== drag.pointerId) return;
    const state = drag;
    drag = null;

    document.querySelectorAll(".node").forEach(el =>
      el.classList.remove("dragging", "drop-target")
    );

    if (state.active) {
      suppressClick = true;
      if (state.targetId !== null) {
        moveNode(state.id, state.targetId);
      }
    }
  });

  document.addEventListener("pointercancel", () => {
    drag = null;
    document.querySelectorAll(".node").forEach(el =>
      el.classList.remove("dragging", "drop-target")
    );
  });

  document.getElementById("addSibling").onclick =
    () => addNode("sibling");
  document.getElementById("addChild").onclick =
    () => addNode("child");
  document.getElementById("editNode").onclick = editSelected;
  document.getElementById("deleteNode").onclick = deleteSelected;

  document.getElementById("resetMap").onclick = () => {
    if (!confirm("試作データを初期化しますか？")) return;
    root = defaultMap();
    selectedId = root.id;
    save();
    render(true);
  };

  save();
  render();
})();
</script>
</body>
</html>
